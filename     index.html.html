<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nisi Platio Struju</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,8,18,.66);color:#fff;text-align:center}.hidden{display:none!important}h1{font-size:clamp(38px,10vw,68px);line-height:.95;margin:0 18px 12px;text-shadow:0 5px 0 #000}.sub{font-size:clamp(16px,4vw,22px);opacity:.9;margin:0 22px 24px}button{border:0;border-radius:16px;padding:15px 30px;font-size:20px;font-weight:900;margin:7px;background:#fff;color:#111;box-shadow:0 5px 0 rgba(0,0,0,.35)}#hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;color:#fff;font-weight:900;font-size:19px;pointer-events:none;text-shadow:0 2px 4px #000}#pause{position:fixed;right:12px;top:52px;border:0;border-radius:12px;padding:8px 13px;font-size:18px;z-index:4}.badge{display:inline-block;background:#e53935;border-radius:12px;padding:7px 12px;margin-bottom:15px;font-weight:900;box-shadow:0 3px 0 #7f1717}.small{font-size:14px;opacity:.72}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><span>⚡ <b id="score">0</b></span><span>🪙 <b id="coins">0</b></span><span>❤️ <b id="lives">3</b></span></div>
<button id="pause" class="hidden">Ⅱ</button>
<div id="menu" class="panel"><div class="badge">⚡ RAČUN ZA STRUJU</div><h1>NISI PLATIO<br>STRUJU!</h1><div class="sub">BEŽI OD PROPELERA VETROTURBINA!</div><button id="start">IGRAJ</button><div class="small">Dodirni ekran za skok</div><div class="small" style="margin-top:10px">Najbolji rezultat: <b id="bestMenu">0</b></div></div>
<div id="over" class="panel hidden"><div class="badge">💥 UHVAĆEN SI!</div><h1>GAME OVER</h1><div id="final" class="sub"></div><button id="again">IGRAJ PONOVO</button><button id="home">MENI</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr,ground,player,props,coins,particles,turbines,clouds;let score=0,coinCount=0,lives=3,speed=360,propTimer=0,coinTimer=0,last=0,running=false,paused=false;let best=+localStorage.getItem('npsBest')||0;function $(id){return document.getElementById(id)}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ground=H-Math.max(90,H*.15)}addEventListener('resize',resize);
function world(){turbines=[];for(let i=0;i<5;i++)turbines.push({x:80+i*230,y:ground-(170+(i%3)*35),s:.75+(i%3)*.16,rot:Math.random()*6.28});clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random()*W,y:45+Math.random()*145,s:.7+Math.random()*.8})}
function start(){resize();world();score=0;coinCount=0;lives=3;speed=Math.max(340,W*.72);propTimer=900;coinTimer=700;props=[];coins=[];particles=[];player={x:Math.min(85,W*.18),y:ground-46,size:46,vy:0,onGround:true,rot:0,inv:0};running=true;paused=false;last=performance.now();$('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden');$('pause').classList.remove('hidden');hud();requestAnimationFrame(loop)}
function hud(){$('score').textContent=Math.floor(score);$('coins').textContent=coinCount;$('lives').textContent=lives}
function jump(){if(!running||paused)return;if(player.onGround){player.vy=-Math.min(820,H*.98);player.onGround=false}else if(player.vy>120)player.vy=-610}
function spawnProp(){let y=ground-65-Math.random()*210,r=25+Math.random()*16,dir=Math.random()<.5?-1:1;props.push({x:W+70,y,r,rot:Math.random()*6.28,spin:(5+Math.random()*7)*dir,vx:speed*(.86+Math.random()*.25),homeY:y})}
function spawnCoin(){coins.push({x:W+35,y:ground-75-Math.random()*210,r:10,spin:0})}
function hit(cx,cy,r,p){let nx=Math.max(p.x,Math.min(cx,p.x+p.size)),ny=Math.max(p.y,Math.min(cy,p.y+p.size));return(cx-nx)**2+(cy-ny)**2<r*r}
function damage(){if(player.inv>0)return;lives--;player.inv=1.5;for(let i=0;i<22;i++)particles.push({x:player.x+23,y:player.y+23,vx:(Math.random()-.5)*340,vy:(Math.random()-.5)*340,t:1,type:'spark'});hud();if(lives<=0)end()}
function end(){running=false;let s=Math.floor(score);if(s>best){best=s;localStorage.setItem('npsBest',best)}$('final').innerHTML=`Rezultat: <b>${s}</b><br>Novčići: <b>${coinCount}</b><br>Najbolji rezultat: <b>${best}</b>`;$('hud').classList.add('hidden');$('pause').classList.add('hidden');$('over').classList.remove('hidden');$('bestMenu').textContent=best}
function update(dt){if(paused)return;score+=dt*10;speed+=dt*4.5;player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y+player.size>=ground){player.y=ground-player.size;player.vy=0;player.onGround=true;player.rot=0}else{player.onGround=false;player.rot+=dt*6}player.inv=Math.max(0,player.inv-dt);propTimer-=dt*1000;coinTimer-=dt*1000;if(propTimer<=0){spawnProp();propTimer=Math.max(430,900+Math.random()*750-Math.min(score*2.2,400))}if(coinTimer<=0){spawnCoin();coinTimer=650+Math.random()*950}turbines.forEach(t=>{t.x-=speed*dt*.16;t.rot+=dt*(2.5+t.s);if(t.x<-100)t.x=W+100+Math.random()*180});clouds.forEach(c=>{c.x-=speed*dt*.035;if(c.x<-130)c.x=W+80});props.forEach(p=>{p.x-=p.vx*dt;p.rot+=p.spin*dt;p.y=p.homeY+Math.sin(p.rot*.7)*18});coins.forEach(o=>{o.x-=speed*dt;o.spin+=dt*8});for(const p of props)if(hit(p.x,p.y,p.r,player)){p.x=-9999;damage()}for(const o of coins)if(hit(o.x,o.y,o.r+4,player)){o.x=-9999;coinCount++;hud()}props=props.filter(p=>p.x+p.r>-50);coins=coins.filter(o=>o.x+o.r>-30);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.t-=dt});particles=particles.filter(p=>p.t>0);hud()}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(0,10,24,0,Math.PI*2);ctx.arc(30,-2,32,0,Math.PI*2);ctx.arc(64,10,23,0,Math.PI*2);ctx.fill();ctx.restore()}
function turbine(t){ctx.save();ctx.translate(t.x,t.y);ctx.scale(t.s,t.s);ctx.fillStyle='#e8edf2';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.lineTo(21,190);ctx.lineTo(-21,190);ctx.closePath();ctx.fill();ctx.fillStyle='#f5f7fa';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.rotate(t.rot);for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);ctx.fillStyle='#d5dce2';ctx.beginPath();ctx.moveTo(4,0);ctx.quadraticCurveTo(42,8,78,2);ctx.quadraticCurveTo(43,-7,4,-5);ctx.closePath();ctx.fill()}ctx.restore()}
function prop(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle='#cfd6dc';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);ctx.fillStyle='#eef2f5';ctx.beginPath();ctx.moveTo(5,-4);ctx.quadraticCurveTo(45,-18,82,-5);ctx.quadraticCurveTo(49,5,7,6);ctx.closePath();ctx.fill();ctx.strokeStyle='#8d99a4';ctx.lineWidth=2;ctx.stroke()}ctx.fillStyle='#555';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5fc7f3');g.addColorStop(.58,'#b9edff');g.addColorStop(1,'#eaf9ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);clouds.forEach(c=>cloud(c.x,c.y,c.s));ctx.fillStyle='#78a9a0';ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=W;x+=90)ctx.lineTo(x,ground-65-Math.sin(x*.012)*35);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();turbines.forEach(turbine);ctx.fillStyle='#35443e';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#65b84a';ctx.fillRect(0,ground-7,W,7);ctx.fillStyle='rgba(255,255,255,.22)';for(let x=-(score*9%110);x<W;x+=110)ctx.fillRect(x,ground+45,55,5);for(let x=-(score*2%260);x<W+260;x+=260){ctx.fillStyle='#f7c600';ctx.beginPath();ctx.moveTo(x+30,ground-45);ctx.lineTo(x+55,ground-5);ctx.lineTo(x+5,ground-5);ctx.closePath();ctx.fill();ctx.fillStyle='#222';ctx.font='bold 25px Arial';ctx.fillText('⚡',x+15,ground-13)}coins.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);ctx.scale(Math.max(.25,Math.abs(Math.cos(o.spin))),1);ctx.fillStyle='#ffd600';ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a77b00';ctx.lineWidth=2;ctx.stroke();ctx.restore()});props.forEach(prop);for(const p of particles){ctx.globalAlpha=p.t;ctx.fillStyle='#fff';ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1;if(player){ctx.save();ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*10)%2?.35:1;ctx.translate(player.x+23,player.y+23);ctx.rotate(player.rot);let cg=ctx.createLinearGradient(-23,-23,23,23);cg.addColorStop(0,'#fff176');cg.addColorStop(.35,'#ffd600');cg.addColorStop(1,'#f57f17');ctx.fillStyle=cg;ctx.fillRect(-23,-23,46,46);ctx.strokeStyle='#9a6500';ctx.lineWidth=3;ctx.strokeRect(-23,-23,46,46);ctx.fillStyle='#222';ctx.fillRect(-12,-8,7,7);ctx.fillRect(5,-8,7,7);ctx.fillRect(-9,8,18,5);ctx.restore()}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.032);last=t;update(dt);draw();requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>{$('over').classList.add('hidden');$('menu').classList.remove('hidden');$('bestMenu').textContent=best};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyP'&&running)$('pause').click();if(e.code==='Enter'&&!running)start()});resize();$('bestMenu').textContent=best;
</script></body></html>
