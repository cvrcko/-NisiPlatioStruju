<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nisi Platio Struju — Load Original</title>
  <style>body{margin:0;font-family:Arial,sans-serif;background:#07101b;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}a{color:#4fd1ff}</style>
</head>
<body>
  <div style="max-width:720px;padding:24px;background:#04202a;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);text-align:left">
    <h2 style="margin-top:0">Nisi Platio Struju — Loader</h2>
    <p>This page directly loads the original game file and replaces this document with it. It avoids the filename with leading spaces so the game is available at /index.html.</p>
    <p><button id="load" style="padding:10px 16px;font-size:16px;cursor:pointer">Load original game</button></p>
    <p style="font-size:13px;opacity:.85">Original file location: <a target="_blank" href="https://github.com/cvrcko/-NisiPlatioStruju/blob/main/%20%20%20%20index.html.html">    index.html.html</a></p>
  </div>

<script>
const RAW = 'https://raw.githubusercontent.com/cvrcko/-NisiPlatioStruju/main/%20%20%20%20index.html.html';
async function loadOriginal(){
  try{
    const res = await fetch(RAW);
    if(!res.ok) throw new Error('Fetch failed: '+res.status);
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML = '<div style="padding:20px;color:#fff">Error loading original game: '+err.message+'<br><br>Open original file on GitHub: <a href="https://github.com/cvrcko/-NisiPlatioStruju/blob/main/%20%20%20%20index.html.html" target="_blank">original</a></div>';
  }
}
document.getElementById('load').addEventListener('click',loadOriginal);
// Auto-load for convenience
loadOriginal();
</script>
</body>
</html>
